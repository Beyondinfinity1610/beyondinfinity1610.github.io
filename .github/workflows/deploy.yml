name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check:disclosure

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

      - run: npm run check:size

      - run: npx playwright install --with-deps chromium

      - run: npm run shots:ci

      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          retention-days: 14

      - run: npm run check:disclosure:dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
