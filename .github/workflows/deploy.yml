name: deploy

# This is a static, no-build site at this point in its history (pre-Vite
# rebuild) — the repo has no package.json to run "npm run build" against.
# GitHub Pages here is configured with Source: GitHub Actions, so a
# workflow still has to exist to publish anything; this just uploads the
# repo root as-is instead of building it first.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
