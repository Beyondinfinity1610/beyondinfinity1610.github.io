<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="fb-title fb-desc">
<title id="fb-title">Sensitivity against false alarms per day</title>
<desc id="fb-desc">A curve of sensitivity against false alarms per day, generated from the same synthetic recording as the playable instrument. The curve stays entirely below and right of a dashed rectangle marking fewer than two false alarms per day and the published 59% expert-reader sensitivity — it never enters the rectangle.</desc>
<rect x="0" y="0" width="640" height="360" fill="#06080a" />

<!-- axes -->
<line x1="70" y1="300" x2="600" y2="300" stroke="rgba(214,224,226,0.35)" stroke-width="1" />
<line x1="70" y1="300" x2="70" y2="40" stroke="rgba(214,224,226,0.35)" stroke-width="1" />
<text x="335" y="332" fill="#8a8279" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1">false alarms / day &#8594;</text>
<text x="24" y="170" fill="#8a8279" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1" transform="rotate(-90 24 170)">sensitivity &#8594;</text>

<!-- the clinically-useful box: the curve never enters it -->
<rect x="70" y="40" width="52" height="118" fill="none" stroke="#9fe0d6" stroke-width="1.5" stroke-dasharray="4 3" />
<text x="134" y="56" fill="#9fe0d6" font-family="monospace" font-size="11">clinically useful</text>
<text x="134" y="72" fill="#8a8279" font-family="monospace" font-size="11">fewer than two false alarms per day</text>

<!-- the ROC-shaped curve -->
<path d="M 70.0 300.0 L 122.0 272.0 L 200.0 236.0 L 300.0 196.0 L 400.0 152.0 L 500.0 108.0 L 600.0 78.0" fill="none" stroke="#4fb0a8" stroke-width="2" />

<text x="70" y="20" fill="#ece7de" font-family="monospace" font-size="13">
<tspan x="70" dy="0">published human expert readers reach roughly 59%</tspan>
<tspan x="70" dy="16">sensitivity on this modality</tspan>
</text>
<text x="70" y="352" fill="#8a8279" font-family="monospace" font-size="10" letter-spacing="0.5">synthetic signal &#183; generated from a fixed seed &#183; not the method under review</text>
<text x="560" y="352" fill="#8a8279" font-family="monospace" font-size="10" letter-spacing="1" opacity="0.5">SYNTHETIC</text>
</svg>
